name = "boom-multiplayer"
main = "server/worker.js"
compatibility_date = "2026-09-01"

[build]
command = "npm run build && npm run package:site"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/room/*", "/health"]

[[durable_objects.bindings]]
name = "BOOM_ROOMS"
class_name = "BoomRoom"

[[migrations]]
tag = "boom-v1"
new_sqlite_classes = ["BoomRoom"]
